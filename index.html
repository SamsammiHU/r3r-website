<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R3R Management Consulting — Energy Solutions & Global Supply Chain</title>
    <meta
      name="description"
      content="R3R integrates top-tier Chinese manufacturing with in-house engineering support to deliver customized energy solutions and global supply chain management for overseas buyers."
    />
    <link rel="canonical" href="https://r3r-mc.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="R3R Management Consulting" />
    <meta property="og:title" content="R3R Management Consulting — Energy Solutions & Global Supply Chain" />
    <meta
      property="og:description"
      content="Customized energy solutions and end-to-end supply chain delivery, backed by Chinese manufacturing and in-house engineering support."
    />
    <meta property="og:url" content="https://r3r-mc.com/" />
    <meta property="og:image" content="https://r3r-mc.com/assets/img/hero_bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a1f38" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="R3R home">
          <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
          <span class="brand-text">
            <strong>R3R</strong>
            <small data-bind="site.sub">Management Consulting</small>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <ul class="nav-links" id="navLinks" data-each="nav">
            <template>
              <li><a data-href="href" data-bind="label"></a></li>
            </template>
          </ul>
          <a class="btn btn--sm btn--dark nav-cta" data-href="cta.href" data-bind="cta.label"></a>
        </nav>
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="hero hero--home">
        <img class="hero-bg" data-img="home.hero.bg" alt="" aria-hidden="true" fetchpriority="high" />
        <div class="hero-overlay"></div>
        <div class="container hero-inner">
          <p class="eyebrow eyebrow--light" data-bind="home.hero.eyebrow"></p>
          <h1 data-bind="home.hero.title"></h1>
          <p class="hero-sub" data-bind="home.hero.subtitle"></p>
          <a class="btn btn--light" data-href="cta.href" data-bind="cta.label"></a>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow" data-bind="home.sectionHead.eyebrow"></p>
            <h2 data-bind="home.sectionHead.title"></h2>
          </div>
          <div class="card-grid card-grid--2" data-each="home.cards">
            <template>
              <a class="card" data-href="href">
                <div class="media">
                  <img data-img="image" data-alt="title" alt="" loading="lazy" />
                </div>
                <div class="card-body">
                  <h3 data-bind="title"></h3>
                  <p data-bind="desc"></p>
                  <span class="text-link"
                    ><span data-bind="linkLabel"></span>
                    <span aria-hidden="true">→</span></span
                  >
                </div>
              </a>
            </template>
          </div>
        </div>
      </section>

      <section class="stats-band" aria-label="Key figures">
        <div class="container stats" data-each="home.stats">
          <template>
            <div class="stat">
              <span class="stat-value" data-bind="value"></span>
              <span class="stat-label" data-bind="label"></span>
            </div>
          </template>
        </div>
      </section>

      <section class="logo-wall" aria-label="Partners and suppliers">
        <div class="container">
          <p class="logo-wall-label" data-bind="home.logoLabel"></p>
          <div class="logo-grid" data-each="partnerLogos">
            <template>
              <img data-img="src" data-alt="alt" alt="" loading="lazy" width="360" height="180" />
            </template>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-top">
          <div class="footer-brand">
            <a class="brand" href="/index.html" aria-label="R3R home">
              <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
              <span class="brand-text">
                <strong>R3R</strong>
                <small data-bind="site.sub">Management Consulting</small>
              </span>
            </a>
            <p data-bind="site.tagline"></p>
          </div>
          <div class="footer-emails">
            <p class="footer-label" data-bind="ui.contact">Contact</p>
            <ul data-each="contact.emails">
              <template>
                <li>
                  <a data-mailto="email" data-bind="email"></a>
                  <span data-bind="title"></span>
                </li>
              </template>
            </ul>
          </div>
          <div class="footer-address">
            <p class="footer-label" data-bind="ui.office">Hong Kong</p>
            <p data-bind="site.address"></p>
          </div>
        </div>
        <div class="footer-bottom">
          <span
            >© <span id="year">2026</span> <span data-bind="site.name"></span>
            <span data-bind="ui.rights"></span
          ></span>
          <span>Hong Kong</span>
        </div>
      </div>
    </footer>

    <noscript>
      <div class="container section">
        <p>
          R3R Management Consulting — customized energy solutions and global supply chain
          management. Email <a href="mailto:business@r3r-mc.com">business@r3r-mc.com</a>.
        </p>
      </div>
    </noscript>

    <script src="/assets/js/main.js" defer></script>
    <script defer data-domain="r3r-mc.com" src="https://plausible.io/js/script.js"></script>
  </body>
</html>
