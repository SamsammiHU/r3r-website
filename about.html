<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About — R3R Management Consulting</title>
    <meta
      name="description"
      content="R3R is a Hong Kong-based B2B integrated solutions company combining data-driven thinking, supply chain experience and engineering support."
    />
    <link rel="canonical" href="https://r3r-mc.com/about.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="R3R Management Consulting" />
    <meta property="og:title" content="About — R3R Management Consulting" />
    <meta
      property="og:description"
      content="A Hong Kong-based B2B solutions company combining data-driven thinking, supply chain experience and engineering support."
    />
    <meta property="og:url" content="https://r3r-mc.com/about.html" />
    <meta property="og:image" content="https://r3r-mc.com/assets/img/hero_bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a1f38" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body data-page="about">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="R3R home">
          <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
          <span class="brand-text">
            <strong>R3R</strong>
            <small data-bind="site.sub">Management Consulting</small>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <ul class="nav-links" id="navLinks" data-each="nav">
            <template>
              <li><a data-href="href" data-bind="label"></a></li>
            </template>
          </ul>
          <a class="btn btn--sm btn--dark nav-cta" data-href="cta.href" data-bind="cta.label"></a>
        </nav>
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow" data-bind="about.hero.eyebrow"></p>
          <h1 data-bind="about.hero.title"></h1>
          <p class="lead" data-bind="about.hero.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="prose">
            <p data-bind="about.body.0"></p>
            <p data-bind="about.body.1"></p>
            <p data-bind="about.body.2"></p>
          </div>
        </div>
      </section>

      <section class="stats-band" aria-label="Company facts">
        <div class="container stats" data-each="about.facts">
          <template>
            <div class="stat">
              <span class="stat-value" data-bind="value"></span>
              <span class="stat-label" data-bind="label"></span>
            </div>
          </template>
        </div>
      </section>

      <section class="cta-band">
        <div class="container">
          <h2 data-bind="cta.title"></h2>
          <a class="btn btn--dark" data-href="cta.href" data-bind="cta.label"></a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-top">
          <div class="footer-brand">
            <a class="brand" href="/index.html" aria-label="R3R home">
              <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
              <span class="brand-text">
                <strong>R3R</strong>
                <small data-bind="site.sub">Management Consulting</small>
              </span>
            </a>
            <p data-bind="site.tagline"></p>
          </div>
          <div class="footer-emails">
            <p class="footer-label" data-bind="ui.contact">Contact</p>
            <ul data-each="contact.emails">
              <template>
                <li>
                  <a data-mailto="email" data-bind="email"></a>
                  <span data-bind="title"></span>
                </li>
              </template>
            </ul>
          </div>
          <div class="footer-address">
            <p class="footer-label" data-bind="ui.office">Hong Kong</p>
            <p data-bind="site.address"></p>
          </div>
        </div>
        <div class="footer-bottom">
          <span
            >© <span id="year">2026</span> <span data-bind="site.name"></span>
            <span data-bind="ui.rights"></span
          ></span>
          <span>Hong Kong</span>
        </div>
      </div>
    </footer>

    <script src="/assets/js/main.js" defer></script>
    <script defer data-domain="r3r-mc.com" src="https://plausible.io/js/script.js"></script>
  </body>
</html>
