<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — R3R Management Consulting</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1f38" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body data-page="404">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="R3R home">
          <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
          <span class="brand-text">
            <strong>R3R</strong>
            <small data-bind="site.sub">Management Consulting</small>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <ul class="nav-links" id="navLinks" data-each="nav">
            <template>
              <li><a data-href="href" data-bind="label"></a></li>
            </template>
          </ul>
          <a class="btn btn--sm btn--dark nav-cta" data-href="cta.href" data-bind="cta.label"></a>
        </nav>
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="notfound">
        <div class="container">
          <h1>404</h1>
          <p>The page you are looking for does not exist or has moved.</p>
          <a class="btn btn--dark" href="/index.html">Back to home</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom" style="margin-top: 0; border-top: 0; padding-top: 0">
          <span>© <span id="year">2026</span> R3R Management Consulting Limited. All rights reserved.</span>
          <a href="mailto:business@r3r-mc.com">business@r3r-mc.com</a>
        </div>
      </div>
    </footer>

    <script src="/assets/js/main.js" defer></script>
  </body>
</html>
