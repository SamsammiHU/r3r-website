<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — R3R Management Consulting</title>
    <meta
      name="description"
      content="Contact R3R for energy projects, supply chain and sourcing, general business, or contracts and billing. Direct emails for each team."
    />
    <link rel="canonical" href="https://r3r-mc.com/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="R3R Management Consulting" />
    <meta property="og:title" content="Contact — R3R Management Consulting" />
    <meta
      property="og:description"
      content="Tell us what you are building. We will route your enquiry to the relevant team."
    />
    <meta property="og:url" content="https://r3r-mc.com/contact.html" />
    <meta property="og:image" content="https://r3r-mc.com/assets/img/hero_bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a1f38" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="R3R home">
          <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
          <span class="brand-text">
            <strong>R3R</strong>
            <small data-bind="site.sub">Management Consulting</small>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <ul class="nav-links" id="navLinks" data-each="nav">
            <template>
              <li><a data-href="href" data-bind="label"></a></li>
            </template>
          </ul>
          <a class="btn btn--sm btn--dark nav-cta" data-href="cta.href" data-bind="cta.label"></a>
        </nav>
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow" data-bind="contact.hero.eyebrow"></p>
          <h1 data-bind="contact.hero.title"></h1>
          <p class="lead" data-bind="contact.hero.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container contact-grid">
          <div>
            <h2 class="section-form-title" data-bind="contact.form.title"></h2>
            <form
              id="contactForm"
              method="POST"
              action="https://formspree.io/f/xyeyqoll"
              novalidate
            >
              <input type="hidden" name="_subject" value="New enquiry — R3R website" />
              <input type="hidden" name="department" id="f-department" value="" />
              <input
                class="hp"
                type="text"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off"
                aria-hidden="true"
              />

              <div class="form-field">
                <label for="f-name" data-bind="contact.form.name"></label>
                <input id="f-name" name="name" type="text" autocomplete="name" required />
              </div>

              <div class="form-field">
                <label for="f-company" data-bind="contact.form.company"></label>
                <input
                  id="f-company"
                  name="company"
                  type="text"
                  autocomplete="organization"
                />
              </div>

              <div class="form-field">
                <label for="f-email" data-bind="contact.form.email"></label>
                <input id="f-email" name="email" type="email" autocomplete="email" required />
              </div>

              <div class="form-field">
                <label for="f-category" data-bind="contact.form.category"></label>
                <select id="f-category" name="category" required data-each="contact.categories">
                  <option value="" disabled selected data-bind="contact.form.categoryPlaceholder"></option>
                  <template>
                    <option data-value="value" data-bind="label"></option>
                  </template>
                </select>
              </div>

              <div class="form-field">
                <label for="f-message" data-bind="contact.form.message"></label>
                <textarea id="f-message" name="message" required></textarea>
              </div>

              <button class="btn btn--dark" type="submit" data-bind="contact.form.submit"></button>
              <p class="form-note" data-bind="contact.form.note"></p>
              <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
            </form>
          </div>

          <div class="email-matrix" data-each="contact.emails">
            <template>
              <a class="email-card" data-mailto="email">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use data-use="icon"></use>
                </svg>
                <h3 data-bind="title"></h3>
                <span class="addr" data-bind="email"></span>
                <p data-bind="desc"></p>
              </a>
            </template>
          </div>
        </div>

        <div class="container">
          <div class="address-block">
            <h3 data-bind="contact.addressTitle"></h3>
            <p data-bind="contact.address"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-top">
          <div class="footer-brand">
            <a class="brand" href="/index.html" aria-label="R3R home">
              <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
              <span class="brand-text">
                <strong>R3R</strong>
                <small data-bind="site.sub">Management Consulting</small>
              </span>
            </a>
            <p data-bind="site.tagline"></p>
          </div>
          <div class="footer-emails">
            <p class="footer-label" data-bind="ui.contact">Contact</p>
            <ul data-each="contact.emails">
              <template>
                <li>
                  <a data-mailto="email" data-bind="email"></a>
                  <span data-bind="title"></span>
                </li>
              </template>
            </ul>
          </div>
          <div class="footer-address">
            <p class="footer-label" data-bind="ui.office">Hong Kong</p>
            <p data-bind="site.address"></p>
          </div>
        </div>
        <div class="footer-bottom">
          <span
            >© <span id="year">2026</span> <span data-bind="site.name"></span>
            <span data-bind="ui.rights"></span
          ></span>
          <span>Hong Kong</span>
        </div>
      </div>
    </footer>

    <script src="/assets/js/main.js" defer></script>
    <script defer data-domain="r3r-mc.com" src="https://plausible.io/js/script.js"></script>
  </body>
</html>
