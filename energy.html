<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Energy Project Coordination — R3R Management Consulting</title>
    <meta
      name="description"
      content="Customized energy storage, PV and EMS projects — backed by Tsinghua University's R&D team and affiliated engineering company Sionix."
    />
    <link rel="canonical" href="https://r3r-mc.com/energy.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="R3R Management Consulting" />
    <meta property="og:title" content="Energy Project Coordination — R3R" />
    <meta
      property="og:description"
      content="Tailored energy storage and project execution for commercial, utility and off-grid applications."
    />
    <meta property="og:url" content="https://r3r-mc.com/energy.html" />
    <meta property="og:image" content="https://r3r-mc.com/assets/img/solution_ci.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a1f38" />
    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body data-page="energy">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html" aria-label="R3R home">
          <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
          <span class="brand-text">
            <strong>R3R</strong>
            <small data-bind="site.sub">Management Consulting</small>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <ul class="nav-links" id="navLinks" data-each="nav">
            <template>
              <li><a data-href="href" data-bind="label"></a></li>
            </template>
          </ul>
          <a class="btn btn--sm btn--dark nav-cta" data-href="cta.href" data-bind="cta.label"></a>
        </nav>
        <button
          class="nav-toggle"
          id="navToggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow" data-bind="energy.hero.eyebrow"></p>
          <h1 data-bind="energy.hero.title"></h1>
          <p class="lead" data-bind="energy.hero.lead"></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow" data-bind="energy.solutionsHead.eyebrow"></p>
            <h2 data-bind="energy.solutionsHead.title"></h2>
          </div>
          <div class="card-grid card-grid--3" data-each="energy.solutions">
            <template>
              <article class="card">
                <div class="media">
                  <img data-img="image" data-alt="title" alt="" loading="lazy" />
                </div>
                <div class="card-body">
                  <h3 data-bind="title"></h3>
                  <p data-bind="desc"></p>
                </div>
              </article>
            </template>
          </div>
        </div>
      </section>

      <section class="section section--surface">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow" data-bind="energy.productsHead.eyebrow"></p>
            <h2 data-bind="energy.productsHead.title"></h2>
          </div>
          <div class="card-grid card-grid--4" data-each="energy.products">
            <template>
              <article class="card">
                <div class="media">
                  <img data-img="image" data-alt="title" alt="" loading="lazy" />
                </div>
                <div class="card-body">
                  <h3 data-bind="title"></h3>
                  <p data-bind="desc"></p>
                </div>
              </article>
            </template>
          </div>
          <p class="note" data-bind="energy.productNote"></p>
        </div>
      </section>

      <section class="section">
        <div class="container split">
          <div class="split-media">
            <div class="media">
              <img
                data-img="energy.ems.image"
                alt="Energy Management System dashboard"
                loading="lazy"
              />
            </div>
          </div>
          <div class="split-body">
            <p class="eyebrow" data-bind="energy.ems.eyebrow"></p>
            <h2 data-bind="energy.ems.title"></h2>
            <p data-bind="energy.ems.intro"></p>
            <div class="points" data-each="energy.ems.points">
              <template>
                <div class="point">
                  <h3 data-bind="title"></h3>
                  <p data-bind="desc"></p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </section>

      <section class="section section--surface">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow" data-bind="energy.cases.eyebrow"></p>
            <h2 data-bind="energy.cases.title"></h2>
          </div>
          <div class="card-grid card-grid--2" data-each="energy.cases.items">
            <template>
              <article class="card">
                <div class="media media--wide">
                  <img data-img="image" data-alt="title" alt="" loading="lazy" />
                </div>
                <div class="card-body">
                  <h3 data-bind="title"></h3>
                  <p data-bind="label"></p>
                </div>
              </article>
            </template>
          </div>
          <p class="note" data-bind="energy.cases.note"></p>
        </div>
      </section>

      <section class="cta-band">
        <div class="container">
          <h2 data-bind="cta.title"></h2>
          <a class="btn btn--dark" data-href="cta.href" data-bind="cta.label"></a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-top">
          <div class="footer-brand">
            <a class="brand" href="/index.html" aria-label="R3R home">
              <img src="/assets/img/logo.svg" alt="R3R" width="32" height="32" />
              <span class="brand-text">
                <strong>R3R</strong>
                <small data-bind="site.sub">Management Consulting</small>
              </span>
            </a>
            <p data-bind="site.tagline"></p>
          </div>
          <div class="footer-emails">
            <p class="footer-label" data-bind="ui.contact">Contact</p>
            <ul data-each="contact.emails">
              <template>
                <li>
                  <a data-mailto="email" data-bind="email"></a>
                  <span data-bind="title"></span>
                </li>
              </template>
            </ul>
          </div>
          <div class="footer-address">
            <p class="footer-label" data-bind="ui.office">Hong Kong</p>
            <p data-bind="site.address"></p>
          </div>
        </div>
        <div class="footer-bottom">
          <span
            >© <span id="year">2026</span> <span data-bind="site.name"></span>
            <span data-bind="ui.rights"></span
          ></span>
          <span>Hong Kong</span>
        </div>
      </div>
    </footer>

    <script src="/assets/js/main.js" defer></script>
    <script defer data-domain="r3r-mc.com" src="https://plausible.io/js/script.js"></script>
  </body>
</html>
